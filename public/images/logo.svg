<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 48" role="img" aria-label="AstraLumen">
  <defs>
    <linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="50%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
    <linearGradient id="beamGrad" x1="50%" y1="100%" x2="50%" y2="0%">
      <stop offset="0%" stop-color="#7c3aed" stop-opacity="0"/>
      <stop offset="60%" stop-color="#7c3aed" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
    <radialGradient id="coreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#7c3aed" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Icon mark -->
  <g transform="translate(0, 0)">
    <circle cx="24" cy="24" r="22" fill="none" stroke="url(#logoGrad)" stroke-width="2" opacity="0.55"/>
    <circle cx="24" cy="24" r="14" fill="url(#coreGlow)" opacity="0.6"/>
    <ellipse cx="24" cy="24" rx="16" ry="6" fill="none" stroke="url(#logoGrad)" stroke-width="1" opacity="0.35" transform="rotate(-20 24 24)"/>
    <circle cx="24" cy="24" r="4" fill="url(#logoGrad)"/>
    <circle cx="24" cy="8" r="2.2" fill="#fbbf24"/>
    <path d="M24 24 L24 44" stroke="url(#beamGrad)" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
  </g>

  <!-- Wordmark -->
  <text x="56" y="22" font-family="'Orbitron', 'Segoe UI', sans-serif" font-size="18" font-weight="700" fill="#e2e8f0" letter-spacing="0.08em">AstraLumen</text>
  <text x="56" y="38" font-family="'Inter', 'Segoe UI', sans-serif" font-size="9" font-weight="500" fill="#06b6d4" letter-spacing="0.22em">SCIENCE &amp; DISCOVERY</text>
</svg>
